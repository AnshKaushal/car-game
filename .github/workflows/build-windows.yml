name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Hutch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          irm https://hutch.blackboard.sh/hutch/install.ps1 | iex

          $hutch = "$env:USERPROFILE\.hutch\bin\hutch.exe"

          if (!(Test-Path $hutch)) {
            throw "Hutch was installed but could not be found at $hutch"
          }

          Write-Host "Hutch: $hutch"
          & $hutch --version

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hutch = "$env:USERPROFILE\.hutch\bin\hutch.exe"

          if (!(Test-Path $hutch)) {
            throw "Hutch not found at $hutch"
          }

          & $hutch run install

      - name: Build Electrobun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hutch = "$env:USERPROFILE\.hutch\bin\hutch.exe"

          if (!(Test-Path $hutch)) {
            throw "Hutch not found at $hutch"
          }

          # Runs electrobun prepare && vite build && electrobun build --env=stable
          # The vite build is required: dist/ is gitignored and electrobun.config.ts
          # copies dist/index.html and dist/assets into the bundle.
          & $hutch run build

      - name: Locate Windows build
        shell: pwsh
        run: |
          Write-Host "Searching for Windows artifacts..."

          Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Extension -in ".exe", ".zip", ".msi"
            } |
            Select-Object FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: oversteer-windows
          path: |
            artifacts/**
            build/**
          if-no-files-found: warn
